<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOKI Chaos Playground — Vulnerable Checkout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .badge {
            background-color: #f8514926;
            color: #f85149;
            border: 1px solid #f8514940;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            color: #f0f6fc;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 24px;
        }
        .price {
            font-size: 28px;
            font-weight: bold;
            color: #58a6ff;
            margin-bottom: 24px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background-color: #2ea043;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .status.processing {
            display: block;
            background-color: #1f6feb26;
            color: #58a6ff;
            border: 1px solid #1f6feb40;
        }
        .status.success {
            display: block;
            background-color: #23863626;
            color: #3fb950;
            border: 1px solid #23863640;
        }
        .status.crash {
            display: block;
            background-color: #f8514926;
            color: #f85149;
            border: 1px solid #f8514940;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge" style="background-color: #23863626; color: #3fb950; border-color: #23863640;">Protected with Debounce Lock</span>
        <h1>Neural Interface Pro V2</h1>
        <p>Target test product with an unhandled concurrent click vulnerability.</p>
        
        <div class="price">$499.00 USD</div>

        <div style="margin-bottom: 16px;">
            <label for="coupon-code" style="display: block; font-size: 12px; margin-bottom: 6px; color: #8b949e;">Promo / Referral Code</label>
            <input type="text" id="coupon-code" placeholder="e.g. LOKI20" style="width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 14px;">
        </div>

        <button id="pay-button" type="button">Confirm & Pay ($499.00)</button>

        <div id="status-box" class="status"></div>
    </div>

    <script>
        // Patched with LOKI AI Recommended Fix:
        // Immediate client-side UI lockout & debounce guard
        let isProcessing = false;
        const payButton = document.getElementById("pay-button");
        const statusBox = document.getElementById("status-box");

        payButton.addEventListener("click", () => {
            // Guard against duplicate invocations
            if (isProcessing) {
                return;
            }

            // Lock execution and disable UI interactions immediately
            isProcessing = true;
            payButton.disabled = true;
            payButton.style.opacity = "0.6";
            payButton.style.cursor = "not-allowed";

            statusBox.textContent = "Processing payment with gateway...";
            statusBox.className = "status processing";

            // Simulates an 800ms asynchronous network transaction
            setTimeout(() => {
                isProcessing = false;
                payButton.disabled = false;
                payButton.style.opacity = "1";
                payButton.style.cursor = "pointer";

                statusBox.textContent = "Payment completed successfully!";
                statusBox.className = "status success";
            }, 800);
        });
    </script>
</body>
</html>
